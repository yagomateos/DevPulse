name: Security Engine

on:
  push:
    paths:
      - "security-engine/**"
      - ".github/workflows/security-engine.yml"
  pull_request:
    paths:
      - "security-engine/**"
      - ".github/workflows/security-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
